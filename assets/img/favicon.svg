<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#5A00FF" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5A00FF" flood-opacity="0.4" />
    </filter>
  </defs>
  <g fill="url(#tmGrad)" filter="url(#subtleShadow)">
    <!-- Letter 'T' (Upper Step) -->
    <!-- Top Bar -->
    <rect x="28" y="70" width="210" height="62" rx="18" />
    <!-- Vertical Stem -->
    <rect x="102" y="70" width="62" height="360" rx="18" />

    <!-- Letter 'm' (Lower Step - Cascading Staircase) -->
    <!-- Left Stem -->
    <rect x="236" y="210" width="56" height="220" rx="16" />
    <!-- First Arch -->
    <path d="M 236 265 C 236 195, 332 195, 332 265 L 332 414 A 16 16 0 0 1 316 430 L 304 430 A 16 16 0 0 1 288 414 L 288 275 C 288 245, 252 245, 246 260 Z" />
    <!-- Middle Stem -->
    <rect x="330" y="210" width="56" height="220" rx="16" />
    <!-- Second Arch -->
    <path d="M 330 265 C 330 195, 426 195, 426 265 L 426 414 A 16 16 0 0 1 410 430 L 398 430 A 16 16 0 0 1 382 414 L 382 275 C 382 245, 346 245, 340 260 Z" />
    <!-- Right Stem -->
